<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#/books">Library</a>
        <div class="navbar-nav">
            <a class="nav-link" href="#/books">Books</a>
            <a class="nav-link" th:href="@{/authors}">Authors</a>
            <a class="nav-link" th:href="@{/genres}">Genres</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div id="bookDetail" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="bookTitle"></h2>
            <div>
                <button id="editBtn" class="btn btn-warning me-2">Edit</button>
                <button id="deleteBtn" class="btn btn-sm btn-danger me-2">Delete Book</button>
                <a href="/books" class="btn btn-secondary">Back to List</a>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Book Information</h5>
                <p class="card-text"><strong>ID:</strong> <span id="bookId"></span></p>
                <p class="card-text"><strong>Author:</strong> <span id="bookAuthor"></span></p>
                <p class="card-text"><strong>Genres:</strong> <span id="bookGenres"></span></p>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Comments (<span id="commentCount">0</span>)</h5>
            </div>
            <div class="card-body">
                <div id="commentsList"></div>
                <p id="noComments" class="text-muted">No comments yet.</p>

                <hr>
                <h6>Add Comment</h6>
                <form onsubmit="addComment(event)">
                    <div class="mb-2">
                        <textarea class="form-control" id="commentText" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Comment</button>
                </form>
            </div>
        </div>
    </div>

    <div id="loading" class="text-center mt-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>

<script>
const API_BASE = '/api/books';
const bookId = parseInt(window.location.pathname.split('/').pop());
let genres = [];

// Load genres for reference
fetch('/api/genres').then(r => r.json()).then(data => { genres = data; }).catch(() => {});

loadBook();

function loadBook() {
    fetch(`${API_BASE}/${bookId}`)
        .then(response => {
            if (!response.ok) throw new Error('Book not found');
            return response.json();
        })
        .then(book => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('bookDetail').style.display = 'block';

            document.getElementById('bookTitle').textContent = book.title;
            document.getElementById('bookId').textContent = book.id;
            document.getElementById('bookAuthor').textContent = book.authorName;

            const genresContainer = document.getElementById('bookGenres');
            genresContainer.innerHTML = book.genresIds.map(gid => {
                const g = genres.find(gen => gen.id === gid);
                return g ? `<span class="badge bg-secondary me-1">${g.name}</span>` : '';
            }).join('');

            renderComments(book.comments);

            document.getElementById('editBtn').onclick = () => window.location.href = `/books/form?id=${book.id}`;
            document.getElementById('deleteBtn').onclick = () => deleteBook(book.id);
        })
        .catch(err => {
            console.error('Error loading book:', err);
            document.getElementById('loading').innerHTML = '<p class="text-danger">Book not found.</p>';
        });
}

function renderComments(comments) {
    const list = document.getElementById('commentsList');
    list.innerHTML = '';
    document.getElementById('commentCount').textContent = comments.length;

    if (comments.length === 0) {
        document.getElementById('noComments').style.display = 'block';
        return;
    }
    document.getElementById('noComments').style.display = 'none';

    comments.forEach(comment => {
        const div = document.createElement('div');
        div.className = 'mb-3 p-3 border rounded';
        div.innerHTML = `
            <p class="mb-1">${comment.text}</p>
            <button class="btn btn-sm btn-danger" onclick="deleteComment(${comment.id})">Delete</button>
        `;
        list.appendChild(div);
    });
}

function addComment(event) {
    event.preventDefault();
    const text = document.getElementById('commentText').value;

    fetch(`${API_BASE}/${bookId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
    })
    .then(response => {
        if (!response.ok) throw new Error('Failed to add comment');
        document.getElementById('commentText').value = '';
        // Reload book to get updated comments
        loadBook();
    })
    .catch(err => console.error('Error adding comment:', err));
}

function deleteComment(id) {
    if (!confirm('Are you sure you want to delete this comment?')) return;
    fetch(`/api/comments/${id}`, { method: 'DELETE' })
        .then(() => loadBook())
        .catch(err => console.error('Error deleting comment:', err));
}

function deleteBook(id) {
    if (!confirm('Are you sure you want to delete this book?')) return;
    fetch(`${API_BASE}/${id}`, { method: 'DELETE' })
        .then(() => window.location.href = '/books')
        .catch(err => console.error('Error deleting book:', err));
}
</script>
</body>
</html>
