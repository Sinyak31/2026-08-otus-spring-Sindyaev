<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#/books">Library</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="#/books">Books</a>
            <a class="nav-link" th:href="@{/authors}">Authors</a>
            <a class="nav-link" th:href="@{/genres}">Genres</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Books</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookModal" onclick="openCreateModal()">Add Book</button>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Genres</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="booksTableBody">
        </tbody>
    </table>
    <p id="noBooks" class="text-muted" style="display:none;">No books found.</p>
</div>

<!-- Modal for Create/Edit -->
<div class="modal fade" id="bookModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="bookForm" onsubmit="saveBook(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Book</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="bookId">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="authorId" class="form-label">Author</label>
                        <select class="form-select" id="authorId" required>
                            <option value="">-- Select Author --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="genresIds" class="form-label">Genres</label>
                        <select class="form-select" id="genresIds" multiple required>
                        </select>
                        <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = '/api/books';
let authors = [];
let genres = [];

// Load authors and genres for the modal
Promise.all([
    fetch('/api/authors').then(r => r.json()),
    fetch('/api/genres').then(r => r.json())
]).then(([authorsData, genresData]) => {
    authors = authorsData;
    genres = genresData;
    populateAuthorSelect();
    populateGenreSelect();
    loadBooks();
}).catch(err => {
    console.error('Error loading data:', err);
});

function populateAuthorSelect() {
    const select = document.getElementById('authorId');
    authors.forEach(author => {
        const option = document.createElement('option');
        option.value = author.id;
        option.textContent = author.fullName;
        select.appendChild(option);
    });
}

function populateGenreSelect() {
    const select = document.getElementById('genresIds');
    genres.forEach(genre => {
        const option = document.createElement('option');
        option.value = genre.id;
        option.textContent = genre.name;
        select.appendChild(option);
    });
}

function loadBooks() {
    fetch(API_BASE)
        .then(response => response.json())
        .then(books => {
            const tbody = document.getElementById('booksTableBody');
            tbody.innerHTML = '';
            if (books.length === 0) {
                document.getElementById('noBooks').style.display = 'block';
                return;
            }
            document.getElementById('noBooks').style.display = 'none';
            books.forEach(book => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${book.id}</td>
                    <td>${book.title}</td>
                    <td>${book.authorName}</td>
                    <td>${book.genresIds.map(gid => {
                        const g = genres.find(gen => gen.id === gid);
                        return g ? `<span class="badge bg-secondary me-1">${g.name}</span>` : '';
                    }).join('')}</td>
                    <td>
                        <a href="/books/${book.id}" class="btn btn-sm btn-info">View</a>
                        <button class="btn btn-sm btn-warning" onclick="openEditModal(${book.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteBook(${book.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(err => console.error('Error loading books:', err));
}

function openCreateModal() {
    document.getElementById('modalTitle').textContent = 'Add Book';
    document.getElementById('bookForm').reset();
    document.getElementById('bookId').value = '';
}

function openEditModal(id) {
    fetch(`${API_BASE}/${id}`)
        .then(response => response.json())
        .then(book => {
            document.getElementById('modalTitle').textContent = 'Edit Book';
            document.getElementById('bookId').value = book.id;
            document.getElementById('title').value = book.title;
            document.getElementById('authorId').value = book.authorId;
            const genreSelect = document.getElementById('genresIds');
            Array.from(genreSelect.options).forEach(option => {
                option.selected = book.genresIds.includes(parseInt(option.value));
            });
            const modal = new bootstrap.Modal(document.getElementById('bookModal'));
            modal.show();
        })
        .catch(err => console.error('Error loading book:', err));
}

function saveBook(event) {
    event.preventDefault();
    const bookId = document.getElementById('bookId').value;
    const title = document.getElementById('title').value;
    const authorId = parseInt(document.getElementById('authorId').value);
    const genreSelect = document.getElementById('genresIds');
    const genresIds = Array.from(genreSelect.selectedOptions).map(opt => parseInt(opt.value));

    const payload = { title, authorId, genresIds };

    let url = API_BASE;
    let method = 'POST';

    if (bookId) {
        url = `${API_BASE}/${bookId}`;
        method = 'PUT';
    }

    fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(response => {
        if (!response.ok) throw new Error('Save failed');
        if (bookId) {
            window.location.href = `/books/${bookId}`;
        } else {
            loadBooks();
        }
    })
    .catch(err => console.error('Error saving book:', err));
}

function deleteBook(id) {
    if (!confirm('Are you sure you want to delete this book?')) return;
    fetch(`${API_BASE}/${id}`, { method: 'DELETE' })
        .then(() => loadBooks())
        .catch(err => console.error('Error deleting book:', err));
}
</script>
</body>
</html>
