server:
  port: 8080

spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: library

mongock:
  runner-type: "ApplicationRunner"
  change-logs-scan-package: ru.otus.hw.mongock.changelog

  mongo-db:
    write-concern:
      journal: true
    read-concern: local

logging:
  level:
    org:
      springframework:
        data:
          mongodb:
            core:
              ReactiveMongoTemplate:  DEBUG