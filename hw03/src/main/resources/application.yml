spring:
  application:
    name: Student Test
  main:
    banner-mode: console
  banner:
    charset: UTF-8
  output:
    ansi:
      enabled: ALWAYS
  messages:
    baseName: messages
    encoding: UTF-8
    fallbackToSystemLocale: false

test:
  rightAnswersCountToPass: 3
  locale: en-US
  fileNameByLocaleTag:
    ru-RU: questions_ru.csv
    en-US: questions.csv