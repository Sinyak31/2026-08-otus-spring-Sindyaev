<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title}">Book Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/books}">Library</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Books</a>
            <a class="nav-link" th:href="@{/authors}">Authors</a>
            <a class="nav-link" th:href="@{/genres}">Genres</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${book.title}">Book Title</h2>
        <div>
            <a th:href="@{/books/form(id=${book.id})}" class="btn btn-warning me-2">Edit</a>
            <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-danger me-2">Delete Book</button>
            </form>
            <a th:href="@{/books}" class="btn btn-secondary">Back to List</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Book Information</h5>
            <p class="card-text"><strong>ID:</strong> <span th:text="${book.id}"></span></p>
            <p class="card-text"><strong>Author:</strong> <span th:text="${book.author?.fullName}"></span></p>
            <p class="card-text"><strong>Genres:</strong>
                <span th:each="genre : ${book.genres}" th:text="${genre.name}" class="badge bg-secondary me-1"></span>
            </p>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Comments (<span th:text="${#lists.isEmpty(book.comments)} ? 0 : ${book.comments.size()}"></span>)</h5>
        </div>
        <div class="card-body">
            <div th:each="comment : ${book.comments}" class="mb-3 p-3 border rounded">
                <p class="mb-1" th:text="${comment.text}"></p>
                <form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post" class="mt-2">
                    <input type="hidden" name="bookId" th:value="${book.id}">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </div>
            <p th:if="${#lists.isEmpty(book.comments)}" class="text-muted">No comments yet.</p>

            <hr>
            <h6>Add Comment</h6>
            <form th:action="@{/comments/books/{bookId}(bookId=${book.id})}" method="post">
                <div class="mb-2">
                    <textarea class="form-control" name="text" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Comment</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
