<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/books}">Library</a>
    </div>
</nav>
<div class="container mt-4">
    <h2>Books</h2>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Books</h2>
        <a th:href="@{/books/form}" class="btn btn-primary">Add Book</a>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Genres</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author?.fullName}"></td>
            <td>
                <span th:each="genre : ${book.genres}" th:text="${genre.name}" class="badge bg-secondary me-1"></span>
            </td>
            <td>
                <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-sm btn-info">View</a>
                <a th:href="@{/books/form(id=${book.id})}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(books)}" class="text-muted">No books found.</p>
</div>
</body>
</html>
