<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.id != null} ? 'Edit Book' : 'Add Book'">Book Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/books}">Library</a>
    </div>
</nav>
<div class="container mt-4">
    <h2 th:text="${book.id != null} ? 'Edit Book' : 'Add Book'">Book Form</h2>
    <form th:action="${book.id != null} ? @{/books/{id}(id=${book.id})} : @{/books}"
          method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title"
                   th:value="${book.title}" required>
        </div>
        <div class="mb-3">
            <label for="authorId" class="form-label">Author</label>
            <select class="form-select" id="authorId" name="authorId" required>
                <option value="">-- Select Author --</option>
                <option th:each="author : ${authors}"
                        th:value="${author.id}"
                        th:text="${author.fullName}"
                        th:selected="${book.author?.id == author.id}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="genresIds" class="form-label">Genres</label>
            <select class="form-select" id="genresIds" name="genresIds" multiple required>
                <option th:each="genre : ${genres}"
                        th:value="${genre.id}"
                        th:text="${genre.name}"
                        th:selected="${book.genres != null and #lists.contains(book.genres.![id], genre.id)}"></option>
            </select>
            <small class="text-muted">Hold Ctrl/Cmd to select multiple</small>
        </div>
        <div class="mb-3">
            <a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">Save</button>
        </div>
    </form>
</div>
</body>
</html>
